<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cloudy 테스트 사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#1A1A1A;
    --line:#E7E7E4;
    --muted:#8A8A85;
    --accent:#2C5CE0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:680px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  header{margin-bottom:40px;}
  h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:15px;
    font-weight:400;
    color:var(--muted);
    margin:0;
  }

  /* ---------- Add panel ---------- */
  .add-panel{
    margin-bottom:44px;
  }
  .add-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .add-grid input{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    padding:12px 0;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  .add-grid input::placeholder{color:#B8B8B3;}
  .add-grid input:focus{border-bottom-color:var(--ink);}

  .add-btn{
    align-self:flex-end;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--ink);
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .12s ease;
    margin-top:4px;
  }
  .add-btn:hover{background:var(--accent);}
  .add-btn:active{transform:scale(0.92);}
  .add-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .form-msg{
    font-size:13px;
    margin:8px 0 0;
    min-height:16px;
    color:var(--muted);
  }
  .form-msg.err{color:#C6402C;}
  .form-msg.ok{color:var(--accent);}

  /* ---------- List of versions ---------- */
  .list{
    display:flex;
    flex-direction:column;
  }
  .item{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 0;
    border-top:1px solid var(--line);
  }
  .item:last-child{border-bottom:1px solid var(--line);}
  .item-version{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    width:52px;
    flex:none;
  }
  .item-body{flex-grow:1;min-width:0;}
  .item-title{
    font-size:16px;
    font-weight:500;
    margin:0 0 2px;
    word-break:break-word;
  }
  .item-url{
    font-size:12.5px;
    color:var(--muted);
    margin:0;
    word-break:break-all;
  }
  .actions{
    display:flex;
    gap:6px;
    flex:none;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    cursor:pointer;
    text-decoration:none;
    color:var(--ink);
    flex:none;
    transition:background .12s ease;
  }
  .icon-btn:hover{background:#F2F2F0;}
  .icon-btn.edit:hover{background:#F2F2F0;color:var(--accent);}
  .icon-btn.save:hover{background:#EBF3FE;color:var(--accent);}
  .icon-btn.cancel:hover{background:#FBEAE6;color:#C6402C;}
  .icon-btn.del:hover{background:#FBEAE6;color:#C6402C;}
  .icon-btn.del.confirm{background:#C6402C;color:#fff;}

  /* ---------- Editing state ---------- */
  .edit-input{
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    background:transparent;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  .edit-input:focus{border-color:var(--ink);}
  .edit-version{
    width:65px;
    flex:none;
  }
  .item.editing .item-body{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  /* empty / loading */
  .empty, .loading{
    padding:40px 0;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    border-top:1px solid var(--line);
  }

  footer{
    margin-top:40px;
    font-size:12.5px;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>cloudy 테스트 사이트</h1>
      <p class="sub">버전별 링크 모음</p>
    </header>

    <section class="add-panel">
      <div class="add-grid">
        <input id="in-version" type="text" placeholder="버전 (예: v1.2)" maxlength="24">
        <input id="in-title" type="text" placeholder="제목" maxlength="60">
        <input id="in-url" type="text" placeholder="링크 URL" maxlength="500">
        <button class="add-btn" id="btn-add" aria-label="추가" title="추가">＋</button>
      </div>
      <p class="form-msg" id="form-msg"></p>
    </section>

    <section class="list" id="grid">
      <div class="loading">불러오는 중…</div>
    </section>

    <footer>이 링크를 공유하면 누구나 브라우저에서 볼 수 있어요.</footer>
  </div>

<script>
  const STORAGE_KEY = 'cgpt6-versions';

  // -------------------------------------------------------------
  // 💡 [여기서 기본 링크를 수정하세요!]
  // 누구나 접속했을 때 기본으로 보이게 하고 싶은 링크를 아래에 적어두세요.
  // -------------------------------------------------------------
  const DEFAULT_VERSIONS = [
    {
      id: 'def-1',
      version: 'v1.0',
      title: '첫 번째 테스트 링크',
      url: 'https://github.com/cloudyshin/cloudy-test',
      createdAt: 1000
    },
    {
      id: 'def-2',
      version: 'v1.1',
      title: '두 번째 테스트 링크',
      url: 'https://google.com',
      createdAt: 2000
    }
  ];

  const gridEl = document.getElementById('grid');
  const msgEl = document.getElementById('form-msg');
  const btnAdd = document.getElementById('btn-add');
  const inVersion = document.getElementById('in-version');
  const inTitle = document.getElementById('in-title');
  const inUrl = document.getElementById('in-url');

  let currentList = [];
  let editingId = null;

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function escapeAttr(str){
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function normalizeUrl(u){
    u = u.trim();
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  async function loadVersions(){
    try{
      let parsed = null;
      if(window.storage && typeof window.storage.get === 'function'){
        const result = await window.storage.get(STORAGE_KEY, true);
        if(result && result.value) parsed = JSON.parse(result.value);
      } else {
        const data = localStorage.getItem(STORAGE_KEY);
        if(data) parsed = JSON.parse(data);
      }

      // 저장된 데이터가 없으면 코드에 작성된 기본 목록(DEFAULT_VERSIONS)을 반환
      if(!parsed || !Array.isArray(parsed) || parsed.length === 0){
        return DEFAULT_VERSIONS;
      }
      return parsed;
    }catch(err){
      return DEFAULT_VERSIONS;
    }
  }

  async function saveVersions(list){
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        const result = await window.storage.set(STORAGE_KEY, JSON.stringify(list), true);
        return !!result;
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        return true;
      }
    }catch(err){
      return false;
    }
  }

  function render(list){
    if(!list.length){
      gridEl.innerHTML = `<div class="empty">아직 등록된 버전이 없어요. 위에서 첫 링크를 추가해보세요.</div>`;
      return;
    }
    const sorted = [...list].sort((a,b) => b.createdAt - a.createdAt);
    gridEl.innerHTML = sorted.map((item) => {
      if(item.id === editingId){
        return `
          <div class="item editing" data-id="${item.id}">
            <input class="edit-input edit-version" type="text" value="${escapeAttr(item.version)}" placeholder="버전" maxlength="24">
            <div class="item-body">
              <input class="edit-input edit-title" type="text" value="${escapeAttr(item.title)}" placeholder="제목" maxlength="60">
              <input class="edit-input edit-url" type="text" value="${escapeAttr(item.url)}" placeholder="링크 URL" maxlength="500">
            </div>
            <div class="actions">
              <button class="icon-btn save" data-action="save-edit" data-id="${item.id}" title="저장" aria-label="저장">✓</button>
              <button class="icon-btn cancel" data-action="cancel-edit" title="취소" aria-label="취소">✕</button>
            </div>
          </div>`;
      }
      return `
        <div class="item" data-id="${item.id}">
          <span class="item-version">${escapeHtml(item.version)}</span>
          <div class="item-body">
            <p class="item-title">${escapeHtml(item.title)}</p>
            <p class="item-url">${escapeHtml(item.url)}</p>
          </div>
          <div class="actions">
            <a class="icon-btn open" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" title="새 창에서 열기" aria-label="열기">↗</a>
            <button class="icon-btn copy" data-action="copy" data-url="${escapeHtml(item.url)}" title="링크 복사" aria-label="링크 복사">⧉</button>
            <button class="icon-btn edit" data-action="edit" data-id="${item.id}" title="수정" aria-label="수정">✎</button>
            <button class="icon-btn del" data-action="del" data-id="${item.id}" title="삭제" aria-label="삭제">×</button>
          </div>
        </div>`;
    }).join('');
  }

  async function refresh(){
    currentList = await loadVersions();
    render(currentList);
    return currentList;
  }

  function setMsg(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'form-msg' + (kind ? ' ' + kind : '');
  }

  btnAdd.addEventListener('click', async () => {
    const version = inVersion.value.trim();
    const title = inTitle.value.trim();
    const url = normalizeUrl(inUrl.value);

    if(!version || !title || !url){
      setMsg('버전, 제목, 링크를 모두 입력해주세요.', 'err');
      return;
    }
    try{ new URL(url); }catch(e){
      setMsg('링크 형식을 확인해주세요.', 'err');
      return;
    }

    btnAdd.disabled = true;
    currentList = await loadVersions();
    currentList.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      version, title, url,
      createdAt: Date.now()
    });
    const ok = await saveVersions(currentList);
    btnAdd.disabled = false;

    if(ok){
      inVersion.value = '';
      inTitle.value = '';
      inUrl.value = '';
      setMsg('추가됐어요.', 'ok');
      render(currentList);
      setTimeout(() => setMsg('', ''), 2000);
    }else{
      setMsg('저장에 실패했어요. 다시 시도해주세요.', 'err');
    }
  });

  gridEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;

    if(action === 'copy'){
      const url = btn.dataset.url;
      try{
        await navigator.clipboard.writeText(url);
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = '⧉', 1200);
      }catch(err){
        window.prompt('링크를 복사하세요:', url);
      }
      return;
    }

    if(action === 'edit'){
      editingId = btn.dataset.id;
      render(currentList);
      return;
    }

    if(action === 'cancel-edit'){
      editingId = null;
      render(currentList);
      return;
    }

    if(action === 'save-edit'){
      const itemEl = btn.closest('.item');
      const newVersion = itemEl.querySelector('.edit-version').value.trim();
      const newTitle = itemEl.querySelector('.edit-title').value.trim();
      const newUrl = normalizeUrl(itemEl.querySelector('.edit-url').value);

      if(!newVersion || !newTitle || !newUrl){
        alert('버전, 제목, 링크를 모두 입력해주세요.');
        return;
      }
      try{ new URL(newUrl); }catch(err){
        alert('링크 형식을 확인해주세요.');
        return;
      }

      const id = btn.dataset.id;
      const target = currentList.find(v => v.id === id);
      if(target){
        target.version = newVersion;
        target.title = newTitle;
        target.url = newUrl;
        await saveVersions(currentList);
      }
      editingId = null;
      render(currentList);
      return;
    }

    if(action === 'del'){
      if(!btn.classList.contains('confirm')){
        btn.classList.add('confirm');
        btn.title = '한 번 더 클릭하면 삭제됩니다';
        setTimeout(() => btn.classList.remove('confirm'), 3000);
        return;
      }
      const id = btn.dataset.id;
      btn.disabled = true;
      currentList = await loadVersions();
      currentList = currentList.filter(v => v.id !== id);
      const ok = await saveVersions(currentList);
      if(ok) render(currentList);
      else btn.disabled = false;
    }
  });

  refresh();
</script>
</body>
</html>
